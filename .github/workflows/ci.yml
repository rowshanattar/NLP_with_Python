name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - name: Install dependencies
              run: |
                make install
            - name: Run tests
              run: |
                make test
            - name: Lint code
              run: |
                make lint
            - name: Format code
              run: |
                black --check *.py nlplogic